[project]
name = "sparkxflow-backend"
version = "0.1.0"
description = "SparkXFlow Nexus backend — modular monolith (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "greenlet>=3.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "phonenumbers>=8.13",
    "tldextract>=5.1",
    "structlog>=24.4",
    "tenacity>=9.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-beautifulsoup4>=4.12",
    # A real PostgreSQL for local development and integration tests, installable
    # without administrator rights. Dev-only: production still runs the container
    # image. The binaries are a third-party repackaging, so they must never reach
    # a runtime dependency set.
    "postgresql-binaries>=18.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF", "BLE"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "no_source_observability: test does not read or mutate the global source health registry",
]
